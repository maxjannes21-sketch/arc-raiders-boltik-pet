<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="daimon-pet-runtime" content="148">
  <title>Daimon Pet</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden !important; background: transparent !important; }
    body { user-select: none; -webkit-user-select: none; }
    /* 球盒的透明边可伸出窗口。hidden 仍允许焦点/scrollIntoView 滚动 stage，
       消息交互会把整只宠物上推一个透明边的高度，且宿主拖拽框不随之移动。
       clip 禁止容器滚动；会话列表仍在自己的 scrollport 内滚动。 */
    #stage { position: relative; width: 100%; height: 100%; overflow: clip; background: transparent; }
    #pet {
      position: absolute;
      left: 50%;
      bottom: 0;
      display: none;
      transform-origin: 50% 100%;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      will-change: background-position, transform;
    }
    #pet-three {
      position: absolute;
      left: 50%;
      bottom: 0;
      display: none;
      width: 128px;
      height: 128px;
      contain: strict;
      transform: translateX(-50%);
    }
    /* pointing hand 只落在 Three 球体实际命中区:canvas 元素的 CSS 光标覆盖
       整个矩形,透明像素区也会显示成手型,所以静态规则不下发光标——由
       reportThreeHitRegion 按射线命中结果内联切换(命中=SVG,未命中=默认);
       窗口其余透明区(body/#stage)保持 auto。按下(拖拽)时命中恒 true,
       保持同一指针,不切回默认。 */
    #error {
      position: absolute;
      inset: 12px;
      display: none;
      place-items: center;
      color: #b91c1c;
      font: 12px/1.4 system-ui, sans-serif;
      text-align: center;
    }

    :root {
      /* Pet 窗口底板必须始终透明:暗色 color-scheme 会让 Chromium 把 iframe
         画布合成成黑色,所以固定 light scheme,暗色完全走 data-theme 变量。 */
      color-scheme: light;
      --pet-bubble-background: #fff;
      --pet-bubble-foreground: #25262b;
      --pet-bubble-border: transparent;
      --pet-bubble-surface: var(--pet-bubble-background);
      --pet-bubble-text: var(--pet-bubble-foreground);
      --pet-bubble-subtext: #6f7278;
      /* Original pet bubble colors from the upstream runtime template. */
      --pet-bubble-progress-text: #25262b;
      --pet-bubble-progress-base: color-mix(in srgb, var(--pet-bubble-progress-text) 62%, transparent);
      --pet-bubble-icon-complete: #1783ff;
      --pet-bubble-icon-info: #ff9500;
      --pet-bubble-icon-info-bg: color-mix(in srgb, var(--pet-bubble-icon-info) 12%, transparent);
      --pet-bubble-icon-error: #ff453a;
      --pet-bubble-icon-complete-bg: color-mix(in srgb, var(--pet-bubble-icon-complete) 12%, transparent);
      --pet-bubble-icon-error-bg: color-mix(in srgb, var(--pet-bubble-icon-error) 12%, transparent);
      --pet-bubble-icon-action: color-mix(in srgb, var(--pet-bubble-card-text) 90%, transparent);
      --pet-bubble-icon-action-bg: rgba(0, 0, 0, 0.03);
      --pet-bubble-card-background: rgba(255, 255, 255, 0.9);
      --pet-bubble-card-border: rgba(0, 0, 0, 0.13);
      --pet-bubble-card-shadow: 0 4px 16.4px 0 rgba(0, 0, 0, 0.1);
      --pet-bubble-card-backdrop: blur(3px);
      --pet-bubble-card-text: #25262b;
      --pet-bubble-close-background: #fff;
      --pet-bubble-close-background-hover: #f0f0f2;
      --pet-bubble-toggle-background-hover: #f5f8ff;
      --pet-bubble-close-foreground: rgba(0, 0, 0, 0.3);
      --pet-bubble-close-shadow: 0 5.14px 10.29px rgba(0, 0, 0, 0.1);
      --pet-bubble-send-background: #fff;
      --pet-bubble-send-foreground: #25262b;
      --pet-bubble-toggle-foreground: rgba(0, 0, 0, 0.6);
      --pet-center-label: #25262b;
    }
    :root[data-theme='dark'] {
      --pet-center-label: #f7f8fa;
      --pet-bubble-subtext: #9a9ea7;
      --pet-bubble-progress-text: #e3e3e3;
      --pet-bubble-icon-complete: #1783ff;
      --pet-bubble-icon-complete-bg: #1c2a3d;
      --pet-bubble-icon-error: #ff453a;
      --pet-bubble-icon-error-bg: color-mix(in srgb, #ff453a 14%, transparent);
      --pet-bubble-icon-action: #e3e3e6;
      --pet-bubble-icon-action-bg: #3a3a3c;
      --pet-bubble-card-background: rgba(41, 41, 41, 0.9);
      --pet-bubble-card-border: rgba(255, 255, 255, 0.12);
      --pet-bubble-card-shadow: 0 4px 16.4px 0 rgba(0, 0, 0, 0.1);
      --pet-bubble-card-backdrop: blur(3px);
      --pet-bubble-card-text: #f7f8fa;
      --pet-bubble-close-background: #2c2c2e;
      --pet-bubble-close-background-hover: #3a3a3c;
      --pet-bubble-toggle-background-hover: #3f3f42;
      --pet-bubble-close-foreground: color-mix(in srgb, var(--pet-bubble-card-text) 60%, transparent);
      --pet-bubble-close-shadow: 0 4px 16.4px 0 rgba(0, 0, 0, 0.1);
      --pet-bubble-send-background: #f5f5f7;
      --pet-bubble-send-foreground: #1c1c1e;
      --pet-bubble-toggle-foreground: rgba(255, 255, 255, 0.6);
    }
    #conversation-bubble {
      position: absolute;
      z-index: 2;
      top: auto;
      bottom: 0;
      left: 50%;
      display: block;
      width: min(320px, calc(100% - 24px));
      max-height: min(460px, calc(100% - 24px));
      overflow: visible;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--pet-center-label);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, 8px) scale(0.96);
      transform-origin: 50% 100%;
      transition:
        opacity 180ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
      visibility: hidden;
      isolation: isolate;
    }
    #conversation-bubble[data-placement='below'] {
      transform-origin: 50% 0%;
    }
    #conversation-center-header {
      position: absolute;
      z-index: 2;
      right: 2px;
      bottom: calc(100% + 8px);
      display: block;
      margin: 0;
      color: var(--pet-center-label);
    }
    #conversation-center-header[hidden],
    .conversation-card[hidden] { display: none !important; }
    #conversation-center-clear-all {
      all: unset;
      display: grid;
      box-sizing: border-box;
      height: 24px;
      place-items: center;
      border: 0.5px solid var(--pet-bubble-card-border);
      border-radius: 999px;
      padding: 0 12px;
      background: var(--pet-bubble-card-background);
      box-shadow: var(--pet-bubble-card-shadow);
      backdrop-filter: var(--pet-bubble-card-backdrop);
      -webkit-backdrop-filter: var(--pet-bubble-card-backdrop);
      color: var(--pet-bubble-card-text);
      font: 500 11px/1.3 system-ui, sans-serif;

%0A%3C%2Ffilter%3E%0A%3C%2Fdefs%3E%0A%3C%2Fsvg%3E") 6 2, pointer;
    }
    #conversation-center-clear-all:hover {
      color: var(--pet-bubble-text);
    }
    .keyboard-navigation #conversation-center-clear-all:focus-visible,
    .keyboard-navigation .conversation-card:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--pet-bubble-text) 56%, transparent);
      outline-offset: 2px;
    }
    #conversation-list {
      /* Keep card shadows inside the scroll clip without moving the cards. */
      padding: 12px;
      margin: -12px;
      position: relative;
      isolation: isolate;
    }
    #conversation-list {
      max-height: var(--pet-conversation-list-max-height, 380px);
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
    }
    #conversation-bubble.notification-expanded #conversation-list {
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-width: none;
      mask-image: linear-gradient(
        to bottom,
        transparent 0,
        #000 var(--pet-list-fade-top, 0px),
        #000 calc(100% - var(--pet-list-fade-bottom, 0px)),
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0,
        #000 var(--pet-list-fade-top, 0px),
        #000 calc(100% - var(--pet-list-fade-bottom, 0px)),
        transparent 100%
      );
    }
    #conversation-bubble.notification-expanded #conversation-list::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    /* 叠放态的假卡层是 #conversation-bubble 的兄弟层:气泡 section 整体
       z-index 2 压在 three canvas 上,假层若留在气泡内( ::before/::after )
       会随气泡一起挡住呼吸浮动的球。拆成 z-index auto 的兄弟层后按 DOM
       序画在 canvas 之下,主卡/close 浮层仍在球之上。几何由 controller 的
       syncStackLayers 跟随主卡(低 5px、每侧内缩 12px,视觉与原 ::before
       一致);transform 形成 stacking context,深层 ::before 的负 z-index
       不会掉到 canvas 后面之外的层级。 */
    #conversation-stack-layers {
      position: absolute;
      display: none;
      left: 50%;
      width: calc(min(320px, 100% - 24px) - 24px);
      border: 0.5px solid var(--pet-bubble-card-border);
      border-radius: 20px;
      background: color-mix(
        in srgb,
        var(--pet-bubble-text) 7%,
        var(--pet-bubble-card-background)
      );
      box-shadow: var(--pet-bubble-card-shadow);
      opacity: 0.94;
      pointer-events: none;
      transform: translateX(-50%) scale(0.96);
      transform-origin: 50% 100%;
    }
    /* count/隐藏态 stage 没有 bubble-visible,假层随气泡一起隐藏 */
    #stage.bubble-visible
      #conversation-bubble.notification-collapsed.has-multiple
      ~ #conversation-stack-layers {
      display: block;
    }
    #conversation-stack-layers::before {
      position: absolute;
      z-index: -1;
      inset: 0 12px -4px;
      display: none;
      border: 0.5px solid var(--pet-bubble-card-border);
      border-radius: 20px;
      background: color-mix(
        in srgb,
        var(--pet-bubble-text) 7%,
        var(--pet-bubble-card-background)
      );
      box-shadow: var(--pet-bubble-card-shadow);
      content: '';
      opacity: 0.72;
      transform: scale(0.9583);
      transform-origin: 50% 100%;
    }
    #stage.bubble-visible
      #conversation-bubble.notification-collapsed.has-many
      ~ #conversation-stack-layers::before {
      display: block;
    }
    .conversation-card {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      overflow: visible;
      border: 0.5px solid var(--pet-bubble-card-border);
      border-radius: 20px;
      padding: 10px 12px;
      background: var(--pet-bubble-card-background);
      box-shadow: var(--pet-bubble-card-shadow);
      backdrop-filter: var(--pet-bubble-card-backdrop);
      -webkit-backdrop-filter: var(--pet-bubble-card-backdrop);

    .conversation-bubble-close[hidden] { display: none !important; }
    .conversation-bubble-close svg {
      display: block;
      width: 20px;
      height: 20px;
    }
    /* 兜底 widget 基础样式的 button:hover(背景洗成 5% 白,白底下等同隐形)要用
       !important 压住;hover 反馈:底色换成可见灰底(glyph 从淡化转实),以元素
       中心轻微放大(transform 不改布局与点击区域,按钮仍是 20px)。
       浅色主题不能用 icon-action-bg(rgba 黑 3% 在白底上等于变透明)。 */
    .conversation-bubble-close:hover,
    .conversation-bubble-close:focus-visible {
      background: var(--pet-bubble-close-background-hover) !important;
      color: var(--pet-bubble-card-text);
      transform: scale(1.08);
    }
    .conversation-bubble-close:active {
      transform: scale(0.94);
    }
    .conversation-card[data-icon-kind='complete'] .conversation-card-status-icon:hover {
      background: var(--pet-bubble-icon-complete-bg) !important;
    }
    .conversation-card[data-icon-kind='info'] .conversation-card-status-icon:hover {
      background: var(--pet-bubble-icon-info-bg) !important;
    }
    .conversation-card[data-icon-kind='error'] .conversation-card-status-icon:hover {
      background: var(--pet-bubble-icon-error-bg) !important;
    }
    .conversation-card-reply:hover {
      background: var(--pet-bubble-icon-action-bg) !important;
      color: var(--pet-bubble-text);
    }
    .conversation-card-reply-send:hover {
      background: var(--pet-bubble-icon-action-bg) !important;
    }
    #conversation-center-clear-all:hover {
      background: var(--pet-bubble-card-background) !important;
    }
    /* hover 反馈:底色提亮 + 以元素中心放大(不动 left/top/宽高,
       不触发 layout 与 hit region 重算);节奏对齐 kimi-pet hover(150ms 起)。 */
    #conversation-bubble-toggle {
      transition:
        transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
        background-color 160ms ease;
    }
    #conversation-bubble-toggle:hover {
      background: var(--pet-bubble-toggle-background-hover) !important;
      transform: scale(1.1);
    }
    .keyboard-navigation .conversation-bubble-close:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--pet-bubble-text) 56%, transparent);
      outline-offset: 1px;
    }

    .conversation-card-stop[hidden] { display: none !important; }
    .conversation-card-stop:disabled {
      cursor: default;
      opacity: 0.45;
    }
    .conversation-card.is-running .conversation-card-stop {
      display: grid;
    }
    .conversation-card-reply svg {
      display: block;
      width: 17px;
      height: 17px;
    }
    .conversation-card-stop svg {
      display: block;
      width: 16px;
      height: 16px;
    }
    .conversation-card:hover .conversation-card-reply,
    .conversation-card:focus-within .conversation-card-reply,
    .conversation-card:hover .conversation-card-stop,

      margin-left: 4px;
      opacity: 1;
      transform: translateY(0);
    }
    .keyboard-navigation .conversation-card-reply:focus-visible {
      width: 30px;

      outline: 2px solid color-mix(in srgb, var(--pet-bubble-text) 56%, transparent);
      outline-offset: 1px;
      opacity: 1;
    }

      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0 0;
      border: 0;
      border-radius: 10px;
      padding: 6px 8px;
      background: var(--pet-bubble-icon-action-bg);
    }
    .conversation-card-reply-section[hidden] { display: none !important; }
    /* Override the host input border; the enclosing form owns the surface. */

      flex: 1 1 auto;
      min-width: 0;
      min-block-size: 0;
      border: 0;
      border-radius: 0;
      outline: none;
      padding: 0;
      background: transparent;
      color: var(--pet-bubble-card-text);

    }

      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;

      from { background-position: 100% 0; }
      to { background-position: 0 0; }

      .conversation-card-progress {

        background: none;

      }

      #conversation-bubble-toggle,
      .conversation-card,
      .conversation-card-reply,
      .conversation-card-stop,
      .conversation-bubble-close {
        transition-duration: 1ms !important;
      }
    }

      position: absolute;
      left: 50%;
      bottom: 60%;
      transform: translateX(-50%) translateY(4px);
      max-width: 230px;
      padding: 8px 12px;
      border-radius: 12px;
      background: #4A4038;
      color: #FFFFFF;
      border: 1px solid #726A64;
      font: 12px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      pointer-events: none;
      z-index: 60;
      opacity: 0;
      transition: opacity 180ms ease, transform 180ms ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
    }
    #boltik-quip.quip-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #boltik-quip::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 10px;
      height: 10px;
      transform: translateX(-50%) rotate(45deg);
      background: inherit;
      border-right: 1px solid #726A64;
      border-bottom: 1px solid #726A64;
    }

    return activity.petState === "waiting" ? completedText || copy.confirmationBody : activity.runState === "running" ? progressText || copy.thinkingBody : activity.runState === "failed" ? completedText || copy.interrupted || copy.failedBody || copy.completedBody : completedText || copy.completedBody;
}

function shouldIncludeConversationActivity(conversation) {
    return Boolean(conversation && typeof conversation.id === "string" && typeof conversation.title === "string" && (conversation.runState === "idle" || conversation.runState === "running" || conversation.runState === "failed"));
}

function conversationPetState(conversation) {
    if (conversation.runState === "failed") return "failed";
    if (conversation.runState !== "running") return "idle";
    const part = conversation.latestPart;
    if (part && typeof part === "object" && part.kind === "interaction") {
        return "waiting";
    }
    return "working";
}

function activityDismissalKey(activity) {
    const turnId = typeof activity.turnId === "string" ? activity.turnId.trim() : "";
    return turnId ? [
        "turn",
        String(activity.id),
        turnId
    ].join("\u0000") : [
        "legacy",
        String(activity.id),
        String(activity.title ?? ""),
        String(activity.runState ?? ""),
        String(activity.petState ?? ""),
        typeof activity.progressText === "string" ? activity.progressText : "",
        typeof activity.text === "string" ? activity.text : ""
    ].join("\u0000");
}

function resolveBubbleHorizontalCenter(anchorX, bubbleWidth, viewportWidth, margin) {
    if (![
        anchorX,
        bubbleWidth,
        viewportWidth,
        margin
    ].every(Number.isFinite) || bubbleWidth <= 0 || viewportWidth <= 0) {
        return viewportWidth / 2;
    }
    const safeMargin = Math.max(0, margin);
    const minimum = safeMargin + bubbleWidth / 2;
    const maximum = viewportWidth - safeMargin - bubbleWidth / 2;
    if (minimum > maximum) return viewportWidth / 2;
    return Math.min(maximum, Math.max(minimum, anchorX));
}

function resolveBubbleVerticalPlacement(aboveY, belowY, desiredHeight, viewportHeight, margin, topControlsHeight) {
    const above = Math.max(0, aboveY - margin - topControlsHeight);
    const below = Math.max(0, viewportHeight - belowY - margin - topControlsHeight);
    const useBelow = desiredHeight > above && below > above;
    return {
        below: useBelow,
        anchor: useBelow ? Math.max(margin, belowY) + topControlsHeight : Math.min(viewportHeight - margin, aboveY),
        maxHeight: useBelow ? below : above
    };
}

function resolveBubbleToggleLeft(petLeft, petRight, toggleWidth, viewportWidth, gap, margin) {
    const right = petRight + gap;
    const preferred = right + toggleWidth <= viewportWidth - margin ? right : petLeft - gap - toggleWidth;
    return Math.max(margin, Math.min(viewportWidth - margin - toggleWidth, preferred));
}

function resolveBubbleListMaxHeight(availableHeight, minHeight, maxHeight) {
    const safeAvailable = Number.isFinite(availableHeight) ? Math.max(0, availableHeight) : 0;
    return Math.min(maxHeight, Math.max(minHeight, safeAvailable));
}

function alignBubbleListHeight(maximumHeight, cardHeight, gap) {
    if (!(cardHeight > 0)) return maximumHeight;
    const safeGap = Number.isFinite(gap) && gap > 0 ? gap : 0;
    const visibleCardCount = Math.max(1, Math.floor((maximumHeight + safeGap) / (cardHeight + safeGap)));
    const alignedHeight = visibleCardCount * cardHeight + Math.max(0, visibleCardCount - 1) * safeGap;
    return Math.min(maximumHeight, Math.ceil(alignedHeight));
}

function resolveBubbleReplyText(draft, placeholder) {
    const text = typeof draft === "string" ? draft.trim() : "";
    return text || placeholder;
}

function formatBubbleCount(count, localeTag) {
    const safeCount = Number.isFinite(count) ? Math.max(0, Math.floor(count)) : 0;
    try {
        return new Intl.NumberFormat(localeTag).format(safeCount);
    } catch  {
        return String(safeCount);
    }
}

      function syncCloseButtons(recent, cards) {

          button.type = 'button';

      async function submitReply() {
        if (replyOpenForId === null || replySending) return;
        const api = widgetConversationsApi();
        const activity =
          activities.find((item) => item.id === replyOpenForId) || null;
        if (!api || typeof api.send !== 'function' || !activity) {
          closeReplyBar();
          return;

        const section = replySectionFor(replyOpenForId);
        const input = section
          ? section.querySelector('.conversation-card-reply-input')

          ? section.querySelector('.conversation-card-reply-send')
          : null;
        actionErrors.delete(activity.id);
        const text = resolveBubbleReplyText(
          input ? input.value : replyDrafts.get(activity.id),
          copy().quickReplyPlaceholder

        replySending = true;
        if (input) input.disabled = true;
        if (send) send.disabled = true;
        let accepted = false;
        try {
          const result = await api.send(activity.id, text);
          accepted = Boolean(result && result.accepted === true);
        } catch {
          accepted = false;
        }
        if (accepted) {
          replyDrafts.delete(activity.id);
          if (replyOpenForId === activity.id) closeReplyBar();
          return;

        // 失败保草稿、解除禁用、不关闭,并给该会话卡片标记错误态
        actionErrors.add(activity.id);
        replySending = false;
        if (input) input.disabled = false;
        if (send) send.disabled = false;

        replySending = false;
        input.disabled = false;
        send.disabled = false;

        syncReplyBarAria();
        if (restoreFocus && typeof input.focus === 'function') {
          input.focus({ preventScroll: true });
        }

          render();
          return;
        }
        void animation.finished
          .catch(() => undefined)
          .then(() => render());

      function dismissAll() {
        for (const activity of orderedActivities()) {
          dismissedActivityKeys.set(
            activity.id,
            activityDismissalKey(activity)
          );
          replyDrafts.delete(activity.id);
          actionErrors.delete(activity.id);

      async function cancelActivity(stop, activity) {
        const api = widgetConversationsApi();

        if (stop.disabled) return;
        actionErrors.delete(activity.id);
        stop.disabled = true;
        try {
          await api.cancel(activity.id);
        } catch {
          // cancel 失败保持现状并标记错误态,状态快照会自然对齐
          actionErrors.add(activity.id);
          render();
        } finally {
          stop.disabled = false;
        }
      }

      function createCard(activity, index, display) {
        const card = document.createElement('div');
        card.className = 'conversation-card' + (activity.runState === 'running' ? ' is-running' : '');
        card.dataset.turnId = activity.turnId || '';
        card.role = 'button';
        card.tabIndex = 0;
        card.dataset.conversationId = activity.id;
        const iconKind = deriveBubbleCardIconKind(activity);
        card.dataset.iconKind = iconKind;
        card.hidden = !isBubbleCardVisible(index, display);
        if (index === 0) card.id = 'conversation-bubble-card';

        const main = document.createElement('span');
        main.className = 'conversation-card-main';
        const text = document.createElement('span');
        text.className = 'conversation-card-text';
        const title = document.createElement('strong');
        title.className = 'conversation-card-title';
        title.textContent = deriveBubbleCardTitle(
          activity.title,
          copy().untitledConversation
        );
        if (index === 0) title.id = 'conversation-bubble-title';
        const body = document.createElement('span');
        body.className = 'conversation-card-body' + (activity.runState === 'running' && iconKind === 'none' ? ' conversation-card-progress' : '');
        body.textContent = deriveBubbleCardBody(activity, copy());
        if (index === 0) body.id = 'conversation-bubble-content';
        text.append(title, body);

        const conversationsApi = widgetConversationsApi();
        const canReply = Boolean(
          conversationsApi && typeof conversationsApi.send === 'function'
        );
        const canCancel = Boolean(
          conversationsApi && typeof conversationsApi.cancel === 'function'
        );

        const reply = document.createElement('button');
        reply.type = 'button';
        reply.className = 'conversation-card-reply';
        reply.innerHTML = ICON_SVGS.reply;
        reply.setAttribute('aria-label', copy().reply);
        reply.setAttribute(
          'aria-expanded',
          replyOpenForId === activity.id ? 'true' : 'false'
        );
        reply.hidden = !canReply;
        reply.addEventListener('click', (event) => {
          event.stopPropagation();
          if (
            shouldExpandBubbleBeforeAction(
              currentDisplay(),
              orderedActivities().length
            )
          ) {
            void setListExpanded(true);
            return;
          }
          if (replyOpenForId === activity.id) {
            closeReplyBar();
            return;
          }
          openReplyBar(activity, card);
        });

        const stop = document.createElement('button');
        stop.type = 'button';
        stop.className = 'conversation-card-stop';
        stop.innerHTML = ICON_SVGS.stop;
        stop.setAttribute('aria-label', copy().stopTask);
        stop.hidden = !canCancel;
        stop.addEventListener('click', (event) => {
          event.stopPropagation();
          if (
            shouldExpandBubbleBeforeAction(
              currentDisplay(),
              orderedActivities().length
            )
          ) {
            void setListExpanded(true);
            return;
          }
          void cancelActivity(stop, activity);
        });

        const statusIcon = document.createElement('button');
        statusIcon.type = 'button';
        statusIcon.className = 'conversation-card-status-icon';
        statusIcon.tabIndex = -1;
        statusIcon.setAttribute('aria-label', activity.runState === 'running' ? title.textContent : closeCardLabel(title.textContent));
        if (iconKind !== 'none') statusIcon.innerHTML = ICON_SVGS[iconKind];
        statusIcon.addEventListener('click', (event) => {
          event.stopPropagation();
          if (
            shouldExpandBubbleBeforeAction(
              currentDisplay(),
              orderedActivities().length
            )
          ) {
            void setListExpanded(true);
            return;
          }
          if (activity.runState === 'running') {
            deps.openConversation(activity.id);
            return;
          }
          dismissCard(activity, card);
        });

        main.append(text, reply, stop, statusIcon);

        const errorEl = document.createElement('p');
        errorEl.className = 'conversation-card-error';
        errorEl.setAttribute('role', 'alert');
        errorEl.textContent = copy().actionFailed;
        errorEl.hidden = !actionErrors.has(activity.id);

        const replySection = document.createElement('form');
        replySection.className = 'conversation-card-reply-section';
        replySection.hidden = true;
        const replyInput = document.createElement('input');
        replyInput.className = 'conversation-card-reply-input';
        replyInput.type = 'text';
        replyInput.placeholder = copy().quickReplyPlaceholder;
        replyInput.setAttribute('aria-label', copy().reply);
        replyInput.autocomplete = 'off';
        const replySend = document.createElement('button');
        replySend.type = 'submit';
        replySend.className = 'conversation-card-reply-send';
        replySend.innerHTML = ICON_SVGS.send;
        replySend.setAttribute('aria-label', copy().sendReply);
        replySection.append(replyInput, replySend);
        replySection.addEventListener('submit', (event) => {
          event.preventDefault();
          if (!replyComposing) void submitReply();
        });
        replySection.addEventListener('click', (event) => {
          event.stopPropagation();
        });
        replyInput.addEventListener('input', () => {
          replyDrafts.set(activity.id, replyInput.value);
        });
        // Re-enter typing after another app gained focus. Renders never request it.
        replyInput.addEventListener('pointerdown', () => deps.onReplyKeyboardFocus?.(true));
        replyInput.addEventListener('compositionstart', () => {
          replyComposing = true;
        });
        replyInput.addEventListener('compositionend', () => {
          replyComposing = false;
        });
        replyInput.addEventListener('keydown', (event) => {
          if (
            event.key === 'Enter' &&
            (event.isComposing || replyComposing || event.keyCode === 229)
          ) {
            event.preventDefault();
            return;
          }
          if (event.key !== 'Escape') return;
          event.stopPropagation();
          closeReplyBar();
        });

        card.append(main, errorEl, replySection);
        card.setAttribute(
          'aria-label',
          [title.textContent, body.textContent].join(
            deps.isChineseLocale() ? '\uFF0C' : ', '
          )
        );
        card.addEventListener('click', () => {
          const display = currentDisplay();
          const next = nextBubbleDisplayOnCardActivate(
            display,
            orderedActivities().length
          );
          if (next !== display) {
            void setListExpanded(true);
            return;
          }
          if (activity.runState === 'failed') {
            dismissCard(activity, card);
            return;
          }
          deps.openConversation(activity.id);
        });
        card.addEventListener('keydown', (event) => {
          if (event.target !== card) return;
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          card.click();
        });
        card.addEventListener('pointerenter', () => revealClose(activity.id));
        card.addEventListener('pointerleave', () =>
          scheduleHideClose(activity.id)
        );
        card.addEventListener('focusin', () => revealClose(activity.id));
        card.addEventListener('focusout', () =>
          scheduleHideClose(activity.id)
        );
        return card;
      }

      function settleVisibility() {
        clearAnimations();
        const cards = [...list.querySelectorAll('.conversation-card')];
        const display = currentDisplay();
        const expanded = display === 'expanded';
        const layers = expanded
          ? 0
          : bubbleStackedLayerCount(orderedActivities().length);
        bubble.classList.toggle('notification-expanded', expanded);
        bubble.classList.toggle('notification-collapsed', !expanded);
        bubble.classList.toggle('has-multiple', layers >= 1);
        bubble.classList.toggle('has-many', layers >= 2);
        header.hidden = !expanded;
        header.style.opacity = '';
        header.style.transform = '';
        cards.forEach((card, index) => {
          card.hidden = !isBubbleCardVisible(index, display);
          card.style.opacity = '';
          card.style.transform = '';
        });
        syncReplyBarPlacement(false);
        syncStackLayers();
      }

      async function setListExpanded(expanded) {
        if (orderedActivities().length < 2 || listExpanded === expanded) return;
        clearAnimations();
        const token = ++transitionToken;
        const firstCard = list.querySelector('.conversation-card');
        if (!firstCard) return;

        if (expanded) {
          const before = firstCard.getBoundingClientRect();
          listExpanded = true;
          bubble.classList.add('notification-expanded');
          bubble.classList.remove(
            'notification-collapsed',
            'has-multiple',
            'has-many'
          );
          header.hidden = false;
          const cards = [...list.querySelectorAll('.conversation-card')];
          cards.forEach((card) => {
            card.hidden = false;
          });
          const after = firstCard.getBoundingClientRect();
          animateElement(
            firstCard,
            [
              {
                transform:
                  'translateY(' +
                  String(before.top - after.top) +
                  'px) scale(0.985)'
              },
              { offset: 0.72, transform: 'translateY(-2px) scale(1.004)' },
              { transform: 'translateY(0) scale(1)' }
            ],
            { duration: 460, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' }
          );
          animateElement(
            header,
            [
              { opacity: 0, transform: 'translateY(10px) scale(0.96)' },
              { opacity: 1, transform: 'translateY(0) scale(1)' }
            ],
            { duration: 360, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' }
          );
          cards.slice(1).forEach((card, index) => {
            animateElement(
              card,
              [
                {
                  opacity: 0,
                  transform:
                    'translateY(' +
                    String(-18 - index * 4) +
                    'px) scale(0.94)'
                },
                {
                  offset: 0.7,
                  opacity: 1,
                  transform: 'translateY(2px) scale(1.006)'
                },
                { opacity: 1, transform: 'translateY(0) scale(1)' }
              ],
              {
                duration: 420,
                delay: index * 34,
                easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
                fill: 'backwards'
              }
            );
          });
          updateToggle();
          updateScrollFade();
          deps.onDidRender({ wasVisible: true });
          return;
        }

        listExpanded = false;
        const outgoing = [
          header,
          ...list.querySelectorAll('.conversation-card:not(:first-child)')
        ]
          .map((element, index) =>
            animateElement(
              element,
              [
                { opacity: 1, transform: 'translateY(0) scale(1)' },
                { opacity: 0, transform: 'translateY(-12px) scale(0.95)' }
              ],
              {
                duration: 170,
                delay: index * 12,
                easing: 'cubic-bezier(0.55, 0, 1, 0.45)'
              }
            )
          )
          .filter(Boolean);
        await Promise.all(
          outgoing.map((animation) => animation.finished.catch(() => undefined))
        );
        if (token !== transitionToken) {
          settleVisibility();
          updateScrollFade();
          deps.onDidRender({ wasVisible: true });
          return;
        }
        const before = firstCard.getBoundingClientRect();
        settleVisibility();
        const after = firstCard.getBoundingClientRect();
        animateElement(
          firstCard,
          [
            {
              transform:
                'translateY(' +
                String(before.top - after.top) +
                'px) scale(0.985)'
            },
            { offset: 0.72, transform: 'translateY(2px) scale(1.004)' },
            { transform: 'translateY(0) scale(1)' }
          ],
          { duration: 420, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' }
        );
        updateToggle();
        updateScrollFade();
        deps.onDidRender({ wasVisible: true });
      }

      function render() {
        const progressTimes = new Map();
        for (const card of list.querySelectorAll('.conversation-card')) {
          const body = card.querySelector('.conversation-card-progress');
          const animation = body && typeof body.getAnimations === 'function'
            ? body.getAnimations().find((item) => item.animationName === 'pet-progress-shimmer')
            : null;
          if (animation) progressTimes.set(card.dataset.conversationId, { turn: card.dataset.turnId, time: animation.currentTime });
        }
        const wasVisible = stage.classList.contains('bubble-visible');
        const recent = orderedActivities();
        transitionToken += 1;
        clearAnimations();
        if (recent.length === 0) {
          listExpanded = false;
          previousFirstId = null;
          closeReplyBar();
          stage.classList.remove('bubble-visible');
          bubble.classList.remove(
            'notification-expanded',
            'notification-collapsed',
            'has-multiple',
            'has-many'
          );
          header.hidden = true;
          list.replaceChildren();
          closeLayer.replaceChildren();
          updateToggle();
          deps.onDidRender({ wasVisible });
          return;
        }
        const display = currentDisplay();
        const expanded = display === 'expanded';
        const layers = expanded ? 0 : bubbleStackedLayerCount(recent.length);
        bubble.classList.toggle('notification-expanded', expanded);
        bubble.classList.toggle('notification-collapsed', !expanded);
        bubble.classList.toggle('has-multiple', layers >= 1);
        bubble.classList.toggle('has-many', layers >= 2);
        header.hidden = !expanded;
        const openSection = replyOpenForId
          ? replySectionFor(replyOpenForId)
          : null;
        const replyHadFocus = Boolean(
          openSection &&
            deps.getActiveElement() ===
              openSection.querySelector('.conversation-card-reply-input')
        );
        const focusedReplyInput = replyHadFocus
          ? openSection.querySelector('.conversation-card-reply-input')
          : null;
        const replySelection = focusedReplyInput
          ? [focusedReplyInput.selectionStart, focusedReplyInput.selectionEnd, focusedReplyInput.selectionDirection]
          : null;
        const cards = recent.map((activity, index) =>
          createCard(activity, index, display)
        );
        list.replaceChildren(...cards);
        for (const card of cards) {
          const previous = progressTimes.get(card.dataset.conversationId);
          const body = card.querySelector('.conversation-card-progress');
          if (!previous || previous.turn !== card.dataset.turnId || !body || typeof body.getAnimations !== 'function') continue;
          const animation = body.getAnimations().find((item) => item.animationName === 'pet-progress-shimmer');
          if (animation && previous.time !== null) animation.currentTime = previous.time;
        }
        syncCloseButtons(recent, cards);
        stage.classList.toggle('bubble-visible', display !== 'count');
        const firstId = recent[0].id;
        if (firstId !== previousFirstId) list.scrollTop = 0;
        previousFirstId = firstId;
        syncReplyBarPlacement(replyHadFocus);
        if (replySelection && replyOpenForId) {
          const input = replySectionFor(replyOpenForId)?.querySelector('.conversation-card-reply-input');
          if (input && typeof input.setSelectionRange === 'function') {
            input.setSelectionRange(replySelection[0], replySelection[1], replySelection[2]);
          }
        }
        updateToggle();
        updateScrollFade();
        syncStackLayers();
        deps.onDidRender({ wasVisible });
      }

      function alignListHeightToCards(maximumHeight) {
        if (!bubble.classList.contains('notification-expanded')) {
          return maximumHeight;
        }
        const cards = [...list.querySelectorAll('.conversation-card')].filter(
          (card) => !card.hidden
        );
        const referenceCard = cards[0];
        const cardHeight = referenceCard
          ? referenceCard.getBoundingClientRect().height
          : 0;
        if (!(cardHeight > 0)) return maximumHeight;
        const gap =
          cards.length > 1
            ? Number.parseFloat(getComputedStyle(cards[1]).marginTop) || 0
            : 0;
        return alignBubbleListHeight(maximumHeight, cardHeight, gap);
      }

      function syncVerticalLayout(bottom, belowTop) {
        const safeBottom = Number.isFinite(bottom) ? Math.max(0, bottom) : 0;
        const expanded = currentDisplay() === 'expanded';
        const controlsHeight = expanded ? 32 : 8;
        // Use content height, independent of the previous viewport constraint.
        const desiredHeight = Math.min(deps.listMaxHeightPx, Math.max(0, list.scrollHeight - 24));
        const placement = resolveBubbleVerticalPlacement(
          innerHeight - safeBottom,
          Number.isFinite(belowTop) ? belowTop : innerHeight,
          desiredHeight,
          innerHeight,
          deps.screenMarginPx + 10,
          controlsHeight
        );
        bubble.dataset.placement = placement.below ? 'below' : 'above';
        bubble.style.top = placement.below ? String(placement.anchor) + 'px' : 'auto';
        bubble.style.bottom = placement.below ? 'auto' : String(innerHeight - placement.anchor) + 'px';
        const maximumListHeight = Math.min(deps.listMaxHeightPx, placement.maxHeight);
        const listHeight = alignListHeightToCards(maximumListHeight);
        list.style.setProperty(
          '--pet-conversation-list-max-height',
          String(Math.ceil(listHeight) + 24) + 'px'
        );
        syncStackLayers();
        syncClosePositions();
      }

      clearAllButton.addEventListener('click', (event) => {
        event.stopPropagation();
        dismissAll();
      });
      toggle.addEventListener('click', (event) => {
        event.stopPropagation();
        const display = currentDisplay();
        const next = nextBubbleDisplayOnToggle(display);
        if (next === display || next === 'hidden') return;
        if (next === 'count') {
          bubbleVisible = false;
          listExpanded = false;
          render();
          return;
        }
        if (display === 'count') {
          bubbleVisible = true;
          render();
          return;
        }
        void setListExpanded(false);
      });
      list.addEventListener('scroll', updateScrollFade);
      document.addEventListener('keydown', () => setKeyboardNavigation(true));
      document.addEventListener('pointerdown', () => setKeyboardNavigation(false), true);
      document.addEventListener('click', (event) => {
        if (event.detail > 0) setKeyboardNavigation(false);
      });

      return {
        setActivities(next) {
          for (const activity of next) {
            const turn = activity.turnId || 'legacy';
            let notified = notifiedTurns.get(activity.id);
            if (!notified || notified.turn !== turn) {
              notified = { turn, kinds: new Set() };
              notifiedTurns.set(activity.id, notified);
            }
            const kind = activity.petState === 'waiting'
              ? 'waiting'
              : activity.runState === 'failed'
                ? 'failed'
                : activity.runState === 'running' && deriveBubbleCardIconKind(activity) === 'error'
                  ? 'tool-error:' + activity.latestPart.toolCallId
                  : activity.runState === 'idle' && activity.unread
                  ? 'complete'
                  : null;
            if (kind && !notified.kinds.has(kind)) {
              notified.kinds.add(kind);
              if (dismissedActivityKeys.get(activity.id) !== activityDismissalKey(activity)) {
                bubbleVisible = true;
                notificationId = activity.id;
              }
            }
          }
          const feedIds = new Set(next.map((activity) => activity.id));
          // 快照里消失的会话清掉对应草稿防泄漏;正在输入的那条保留
          for (const id of replyDrafts.keys()) {
            if (!feedIds.has(id) && id !== replyOpenForId) replyDrafts.delete(id);
          }
          for (const [id, dismissalKey] of dismissedActivityKeys) {
            if (
              !feedIds.has(id) &&
              dismissalKey.indexOf('legacy\u0000') === 0
            ) {
              dismissedActivityKeys.delete(id);
            }
          }
          activities = next;
        },
        render,
        hide() {
          transitionToken += 1;
          clearAnimations();
          bubbleVisible = true;
          listExpanded = false;
          previousFirstId = null;
          closeReplyBar();
          if (closeHideTimer) {
            clearTimeout(closeHideTimer);
            closeHideTimer = 0;
          }
          closeRevealId = null;
          stage.classList.remove('bubble-visible');
          bubble.classList.remove(
            'notification-expanded',
            'notification-collapsed',
            'has-multiple',
            'has-many'
          );
          header.hidden = true;
          list.replaceChildren();
          closeLayer.replaceChildren();
          updateToggle();
          deps.onDidRender({ wasVisible: false });
        },
        refreshLocale() {
          clearAllButton.textContent = copy().clearAll;
          updateToggle();
          if (orderedActivities().length > 0) render();
        },
        visibleCount() {
          return orderedActivities().length;
        },
        anyAwaitingApproval() {
          return activities.some((activity) => activity.awaitingApproval);
        },
        isVisible() {
          return stage.classList.contains('bubble-visible');
        },
        displayState: currentDisplay,
        syncVerticalLayout
      };
    }

    const stage = document.getElementById('stage');
    const conversationBubble = document.getElementById('conversation-bubble');
    const conversationCenterHeader = document.getElementById('conversation-center-header');
    const conversationCenterClearAll = document.getElementById('conversation-center-clear-all');
    const conversationList = document.getElementById('conversation-list');
    const conversationCloseLayer = document.getElementById('conversation-close-layer');
    const conversationStackLayers = document.getElementById('conversation-stack-layers');
    const conversationBubbleToggle = document.getElementById('conversation-bubble-toggle');
    const conversationBubbleToggleIcon = document.getElementById('conversation-bubble-toggle-icon');
    const conversationBubbleToggleCount = document.getElementById('conversation-bubble-toggle-count');
    const pet = document.getElementById('pet');
    const threePet = document.getElementById('pet-three');
    const error = document.getElementById('error');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let manifest = null;
    let threePetHandle = null;
    let threeBaseDragRect = null;
    let threePointerHit = null;
    let threeDragging = false;
    let stateName = 'idle';
    let preferredStateName = 'idle';
    let interactionStateActive = false;
    let frame = 0;
    let lastFrameAt = performance.now();
    let pointerIdleTimer = 0;
    let idleVariantTimer = 0;
    let pointerInside = false;
    let animationFrameRequest = 0;
    let animationWakeTimer = 0;
    let idleFrameRate = false;
    let displayScale = 1;
    let petAnchorXRatio = 0.5;
    let petAnchorBottomRatio = 1;
    let visibleBoundsByState = Object.create(null);
    let activities = [];
    let currentLocaleTag = 'en-US';
    let lastErrorKey = null;

    function normalizeLocaleTag(value) {
      const tag = typeof value === 'string' ? value.trim() : '';
      return tag || 'en-US';
    }

    function isChineseLocale(value) {
      return /^zh(?:-|$)/i.test(normalizeLocaleTag(value));
    }

    function currentCopy() {
      return UI_COPY[resolveCopyLocale(currentLocaleTag, UI_COPY_LOCALES)] || UI_COPY['en-US'];
    }

    function formatCopy(template, replacements) {
      return String(template).replace(/{([A-Za-z]+)}/g, (match, key) =>
        Object.prototype.hasOwnProperty.call(replacements, key)
          ? String(replacements[key])
          : match
      );
    }

    function callingToolLabel(toolName) {
      if (!toolName) return currentCopy().callingTool;
      return formatCopy(currentCopy().callingToolNamed, { toolName });
    }

    function applyHostLocale(value) {
      currentLocaleTag = normalizeLocaleTag(value);
      const copy = currentCopy();
      document.documentElement.lang = currentLocaleTag;
      stage.setAttribute('aria-label', copy.petAria);
      conversationBubble.setAttribute('aria-label', copy.recentTasksAria);
      const petName =
        manifest && typeof manifest.name === 'string' && manifest.name.trim()
          ? manifest.name
          : copy.petAria;
      pet.setAttribute('aria-label', petName);
      threePet.setAttribute('aria-label', petName);
      if (lastErrorKey) error.textContent = copy[lastErrorKey] || lastErrorKey;
      bubbleController.refreshLocale();
    }

    function showError(messageKey) {
      lastErrorKey = messageKey;
      pet.style.display = 'none';
      threePet.style.display = 'none';
      error.textContent = currentCopy()[messageKey] || messageKey;
      error.style.display = 'grid';
    }

    function applyBubbleTheme(value) {
      if (
        !value ||
        typeof value.background !== 'string' ||
        typeof value.foreground !== 'string' ||
        typeof value.border !== 'string' ||
        !/^#[0-9A-Fa-f]{6}$/.test(value.background) ||
        !/^#[0-9A-Fa-f]{6}$/.test(value.foreground) ||
        !/^#[0-9A-Fa-f]{6}$/.test(value.border)
      ) {
        return false;
      }
      const background = value.background.toUpperCase();
      document.documentElement.style.setProperty(
        '--pet-bubble-background',
        background
      );
      document.documentElement.style.setProperty(
        '--pet-bubble-foreground',
        value.foreground.toUpperCase()
      );
      document.documentElement.style.setProperty(
        '--pet-bubble-border',
        value.border.toUpperCase()
      );
      return true;
    }

    function isThreeManifest(value) {
      return Boolean(value && value.renderer === 'three' && value.three);
    }

    function handleThreePointerMove(event) {
      if (!isThreeManifest(manifest)) return;
      if (!threePetHandle || typeof threePetHandle.setCursor !== 'function') return;
      const rect = threePet.getBoundingClientRect();
      const inside =
        rect.width > 0 &&
        rect.height > 0 &&
        Number.isFinite(event.clientX) &&
        Number.isFinite(event.clientY) &&
        event.clientX >= rect.left &&
        event.clientX < rect.right &&
        event.clientY >= rect.top &&
        event.clientY < rect.bottom;
      try {
        threePetHandle.setCursor(event.clientX, event.clientY, inside, event.screenX);
      } catch {
        // A Three bundle cursor error must not break the Pet runtime.
      }
    }

    function currentPetAnchor() {
