    function resize() {
      if (!manifest) return;
      const anchor = syncPetAnchorLayout();
      if (isThreeManifest(manifest)) {
        const size = hostDisplaySize ?? Math.max(1, Math.round(BASE_DISPLAY_SIZE_PX * displayScale));
        threePet.style.width = String(size) + 'px';
        threePet.style.height = String(size) + 'px';
        // 气泡底部对齐球体可见上沿(kimi 球在画布居中、半径约 1/8 画布宽)
        bubbleController.syncVerticalLayout(
          innerHeight - anchor.bottom +
            Math.round(size * THREE_PET_BALL_TOP_FRACTION) +
            THREE_PET_BUBBLE_GAP_PX,
          anchor.bottom - size * (THREE_PET_BALL_CENTER_FRACTION - THREE_PET_BALL_RADIUS_FRACTION) + THREE_PET_BUBBLE_GAP_PX
        );
        if (threePetHandle && typeof threePetHandle.resize === 'function') {
          threePetHandle.resize();
        }
        if (bubbleController.visibleCount() > 0) {
          // 折叠钮:球右侧、圆心在球的上 1/3 处、与其他图标容器同款的 30px 正圆
          const toggleSize = THREE_PET_TOGGLE_SIZE_PX;
          conversationBubbleToggle.style.setProperty(
            '--pet-bubble-toggle-size',
            String(toggleSize) + 'px'
          );
          const toggleCenterY =
            anchor.bottom -
            size * (1 - THREE_PET_BALL_CENTER_FRACTION) -
            size * THREE_PET_TOGGLE_RISE_FRACTION;
          const ballRight = anchor.x + size * THREE_PET_BALL_RADIUS_FRACTION;
          conversationBubbleToggle.style.left =
            String(Math.round(resolveBubbleToggleLeft(
              anchor.x - size * THREE_PET_BALL_RADIUS_FRACTION,
              ballRight, toggleSize, innerWidth, THREE_PET_TOGGLE_GAP_PX, 6
            ))) + 'px';
          conversationBubbleToggle.style.top =
            String(Math.round(Math.min(
              innerHeight - toggleSize - 6,
              Math.max(6, toggleCenterY - toggleSize / 2)
            ))) + 'px';
        }
        measureThreeDragRect();
        reportInteractiveRegion(currentThreeDragRect());
        return;
      }
      const atlas = manifest.atlas;
      const baseScale = Math.min(
        SPRITESHEET_BASE_DISPLAY_SIZE_PX / atlas.frameWidth,
        SPRITESHEET_BASE_DISPLAY_SIZE_PX / atlas.frameHeight
      );
      const scale = Math.max(0.05, baseScale * displayScale);
      const bounds = visibleBoundsByState[stateName] || {
        left: 0,
        top: 0,
        right: atlas.frameWidth,
        bottom: atlas.frameHeight
      };
      const visiblePetTopFromBottom = (atlas.frameHeight - bounds.top) * scale;
      bubbleController.syncVerticalLayout(
        innerHeight - anchor.bottom + visiblePetTopFromBottom + BUBBLE_GAP_PX,
        anchor.bottom - (atlas.frameHeight - bounds.bottom) * scale + BUBBLE_GAP_PX
      );
      pet.style.transform = 'translateX(-50%) scale(' + String(scale) + ')';
      const frameLeft = anchor.x - atlas.frameWidth * scale / 2;
      const frameTop = anchor.bottom - atlas.frameHeight * scale;
      const left = Math.floor(frameLeft + bounds.left * scale);
      const top = Math.floor(frameTop + bounds.top * scale);
      const right = Math.ceil(frameLeft + bounds.right * scale);
      const bottom = Math.ceil(frameTop + bounds.bottom * scale);
      if (bubbleController.visibleCount() > 0) {
        const toggleWidth = Math.max(22, conversationBubbleToggle.offsetWidth);
        const toggleHeight = Math.max(22, conversationBubbleToggle.offsetHeight);
        conversationBubbleToggle.style.left =
          String(resolveBubbleToggleLeft(left, right, toggleWidth, innerWidth, 8, 6)) + 'px';
        conversationBubbleToggle.style.top =
          String(Math.min(
            innerHeight - toggleHeight - 6,
            Math.max(6, bottom - toggleHeight + 2 - BUBBLE_TOGGLE_NUDGE_PX)
          )) + 'px';
      }
      const dragRect = {
        x: left,
        y: top,
        width: Math.max(1, right - left),
        height: Math.max(1, bottom - top)
      };
      reportInteractiveRegion(dragRect);
    }

    function measureVisibleSpriteBounds(image) {
      if (!manifest) return Object.create(null);
      const atlas = manifest.atlas;
      const framePixels = atlas.frameWidth * atlas.frameHeight;
      if (framePixels <= 0 || framePixels > MAX_VISIBLE_BOUNDS_SCAN_PIXELS) {
        return Object.create(null);
      }
      const canvas = document.createElement('canvas');
      canvas.width = atlas.frameWidth;
      canvas.height = atlas.frameHeight;
      const context = canvas.getContext('2d', { willReadFrequently: true });
      if (!context) return Object.create(null);
      const measured = Object.create(null);
      let remainingScanPixels = MAX_VISIBLE_BOUNDS_SCAN_PIXELS;
      try {
        for (const [name, state] of Object.entries(manifest.states)) {
          const stateScanPixels = state.frames * framePixels;
          if (stateScanPixels > remainingScanPixels) continue;
          remainingScanPixels -= stateScanPixels;
          let opaqueLeft = atlas.frameWidth;
          let opaqueTop = atlas.frameHeight;
          let opaqueRight = -1;
          let opaqueBottom = -1;
          for (let frameIndex = 0; frameIndex < state.frames; frameIndex += 1) {
            context.clearRect(0, 0, atlas.frameWidth, atlas.frameHeight);
            context.drawImage(
              image,
              frameIndex * atlas.frameWidth,
              state.row * atlas.frameHeight,
              atlas.frameWidth,
              atlas.frameHeight,
              0,
              0,
              atlas.frameWidth,
              atlas.frameHeight
            );
            const pixels = context.getImageData(0, 0, atlas.frameWidth, atlas.frameHeight).data;
            for (let y = 0; y < atlas.frameHeight; y += 1) {
              const rowStart = y * atlas.frameWidth * 4;
              for (let x = 0; x < atlas.frameWidth; x += 1) {
                if (pixels[rowStart + x * 4 + 3] > SPRITE_ALPHA_THRESHOLD) {
                  opaqueLeft = Math.min(opaqueLeft, x);
                  opaqueTop = Math.min(opaqueTop, y);
                  opaqueRight = Math.max(opaqueRight, x + 1);
                  opaqueBottom = Math.max(opaqueBottom, y + 1);
                }
              }
            }
          }
          if (opaqueRight > opaqueLeft && opaqueBottom > opaqueTop) {
            measured[name] = {
              left: opaqueLeft,
              top: opaqueTop,
              right: opaqueRight,
              bottom: opaqueBottom
            };
          }
        }
      } catch {
        return Object.create(null);
      }
      return measured;
    }

    function measureSpritesheetWhenReady() {
      const image = new Image();
      image.crossOrigin = 'anonymous';
      image.addEventListener('load', () => {
        visibleBoundsByState = measureVisibleSpriteBounds(image);
        resize();
      }, { once: true });
      image.src = '/workspace/' + encodeURIComponent(manifest.spritesheet);
    }

    function hideConversationBubble() {
      bubbleController.hide();
    }

    function handleBubbleDidRender() {
      // 气泡弹出/更新时唤醒渲染循环到 60fps 活跃窗:
      // 深度空闲档(4fps)下首帧动画和 resize 后的补帧不会被帧率封顶拖住
      if (threePetHandle && typeof threePetHandle.noteActivity === 'function') {
        threePetHandle.noteActivity();
      }
      resize();
    }

    conversationBubble.addEventListener('transitionend', (event) => {
      if (event.target === conversationBubble) resize();
    });

    function normalizeConversationStatus(value) {
      if (!value || !Array.isArray(value.conversations)) {
        return { activities: [], activeId: null };
      }
      return {
        activities: value.conversations
          .filter(shouldIncludeConversationActivity)
          .map((conversation) => ({
            id: conversation.id,
            turnId:
              typeof conversation.turnId === 'string' && conversation.turnId.trim()
                ? conversation.turnId
                : undefined,
            title: conversation.title,
            text: conversationStatusPartText(conversation.latestPart),
            progressText: conversationStatusProgressText(conversation.latestPart),
            runState: conversation.runState,
            latestPart: conversation.latestPart,
            unread: conversation.unread === true,
            hasError: conversation.runState === 'failed',
            petState: conversationPetState(conversation),
            awaitingApproval: conversationAwaitingApproval(conversation)
          })),
        activeId: typeof value.activeConversationId === 'string'
          ? value.activeConversationId
          : null
      };
    }

    function conversationStatusPartText(part) {
      if (!part || typeof part !== 'object') return '';
      if (part.kind === 'interaction') {
        return part.interactionKind === 'question'
          ? currentCopy().chooseOption
          : currentCopy().confirmationBody;
      }
      if (part.kind === 'tool-result') return typeof part.summary === 'string' ? part.summary : '';
      if (part.kind === 'text') {
        return typeof part.text === 'string' ? part.text : '';
      }
      return '';
    }

    function conversationStatusProgressText(part) {
      if (!part || typeof part !== 'object' || part.kind !== 'tool-call') return '';
      const toolName =
        typeof part.toolName === 'string' && part.toolName.trim()
          ? part.toolName.trim()
          : '';
      return callingToolLabel(toolName);
    }

    function conversationAwaitingApproval(conversation) {
      const part = conversation.latestPart;
      return Boolean(
        conversation.runState === 'running' &&
        part &&
        part.kind === 'interaction' &&
        part.interactionKind === 'tool-approval'
      );
    }

    function preferredActivityState() {
      const priority = ['waiting', 'working'];
      for (const state of priority) {
        if (activities.some((activity) => activity.petState === state)) return state;
      }
      return 'idle';
    }

    function handleConversationStatus(status) {
      const feed = normalizeConversationStatus(status);
      activities = feed.activities;
      noteConversationCompletions(feed.activities);
      bubbleController.setActivities(feed.activities);
      if (feed.activities.length === 0) {
        hideConversationBubble();
        setPreferredState('idle');
        return;
      }
      bubbleController.render();
      setPreferredState(preferredActivityState());
    }

    function openConversation(conversationId) {
      if (
        !conversationsApi ||
        typeof conversationsApi.open !== 'function'
      ) {
        return;
      }
      conversationsApi.open(conversationId);
    }

    function render() {
      if (!manifest || isThreeManifest(manifest)) return;
      const atlas = manifest.atlas;
      const state = manifest.states[stateName] || manifest.states.idle;
      const safeFrame = reducedMotion.matches ? 0 : frame % state.frames;
      pet.style.backgroundPosition =
        String(-safeFrame * atlas.frameWidth) + 'px ' + String(-state.row * atlas.frameHeight) + 'px';
    }

    function resolveStateName(nextState) {
      if (!manifest || typeof nextState !== 'string') return 'idle';
      if (isThreeManifest(manifest)) {
        return THREE_PET_STATES.includes(nextState) ? nextState : 'idle';
      }
      if (manifest.states[nextState]) return nextState;
      const legacyAliases = {
        running_left: 'dragLeft',
        running_right: 'dragRight',
        working: 'idle',
        failed: 'idle',
        waiting: 'idle',
        idle_random_1: 'idle',
        idle_random_2: 'idle'
      };
      const legacyState = legacyAliases[nextState];
      return legacyState && manifest.states[legacyState] ? legacyState : 'idle';
    }

    function usesPointerIdleFrameInterval() {
      return (
        idleFrameRate &&
        stateName !== 'idle_random_1' &&
        stateName !== 'idle_random_2'
      );
    }

    function setState(nextState) {
      if (!manifest) return;
      const resolvedState = resolveStateName(nextState);
      if (stateName === resolvedState) return;
      const usedPointerIdleFrameInterval = usesPointerIdleFrameInterval();
      stateName = resolvedState;
      frame = 0;
      lastFrameAt = performance.now();
      resize();
      render();
      if (threePetHandle && typeof threePetHandle.setState === 'function') {
        try {
          threePetHandle.setState(resolvedState);
        } catch {
          // A Three bundle state error must not break the Pet runtime.
        }
      }
      if (usedPointerIdleFrameInterval !== usesPointerIdleFrameInterval()) {
        restartAnimationSchedule();
      }
    }

    function setPreferredState(nextState) {
      preferredStateName =
        nextState === 'working' ||
        nextState === 'waiting'
          ? nextState
          : 'idle';
      clearIdleVariantTimer();
      if (!interactionStateActive) setState(preferredStateName);
      scheduleIdleVariant();
    }

    function handleHostState(nextState) {
      if (!manifest || typeof nextState !== 'string') return;
      if (nextState === 'running_left' || nextState === 'running_right') {
        clearIdleVariantTimer();
        // 只在拖动方向变化时传递一次,100ms 重复 host 消息不再触发重复弹跳
        if (stateName !== nextState) {
          interactionStateActive = true;
          setState(nextState);
        }
        return;
      }
      interactionStateActive = false;
      setState(preferredStateName);
      scheduleIdleVariant();
    }

    function clearPointerIdleTimer() {
      if (!pointerIdleTimer) return;
      clearTimeout(pointerIdleTimer);
      pointerIdleTimer = 0;
    }

    function clearIdleVariantTimer() {
      if (!idleVariantTimer) return;
      clearTimeout(idleVariantTimer);
      idleVariantTimer = 0;
    }

    function availableIdleVariants() {
      if (!manifest || isThreeManifest(manifest)) return [];
      return ['idle_random_1', 'idle_random_2']
        .filter((name) => Boolean(manifest.states[name]));
    }

    function scheduleIdleVariant() {
      clearIdleVariantTimer();
      if (
        !manifest ||
        isThreeManifest(manifest) ||
        reducedMotion.matches ||
        interactionStateActive ||
        preferredStateName !== 'idle' ||
        stateName !== 'idle'
      ) {
        return;
      }
      const variants = availableIdleVariants();
      if (variants.length === 0) return;
      const delayRange = IDLE_VARIANT_MAX_DELAY_MS - IDLE_VARIANT_MIN_DELAY_MS;
      const delay = IDLE_VARIANT_MIN_DELAY_MS + Math.floor(Math.random() * (delayRange + 1));
      idleVariantTimer = setTimeout(() => {
        idleVariantTimer = 0;
        if (
          interactionStateActive ||
          preferredStateName !== 'idle' ||
          stateName !== 'idle'
        ) {
          return;
        }
        const currentVariants = availableIdleVariants();
        if (currentVariants.length === 0) return;
        const index = Math.floor(Math.random() * currentVariants.length);
        setState(currentVariants[index] || currentVariants[0]);
      }, delay);
    }

    // ===== Кастомизация «Болтика»: празднование, шутки, реакции на клик =====
    const QUIP_MIN_DELAY_MS = 180000;
    const QUIP_MAX_DELAY_MS = 480000;
    const BOLTIK_QUIPS = {
      ru: {
        celebration: [
          'Пиу-пиу-пиу! Задача зачищена!',
          'Пиу-пиу! Рейд завершён — добыча в кармане!',
          'Пиу-пиу-пиу-пиу! Сперанца может гордиться!',
          'Готово! Отмечаю очередью в потолок!'
        ],
        idle: [
          'Я тут пересчитал болты в рюкзаке… одного не хватает. Ладно, потом разберёмся.',
          'Термос ещё тёплый. Значит, рейд продолжается.',
          'Если увидишь ARC — ты не видел ARC. Договорились?',
          'Ключ на 14 решает 90% проблем. Остальные 10% — ключ на 17.',
          'Гул сверху слышишь?.. А, это у тебя компьютер.',
          'Главное на поверхности — не лут, а выживание. И лут.',
          'Погладил фонарик. Он сказал, что ты молодец.'
        ],
        click: [
          'А? Что? Я на посту!',
          'Тук-тук! Кто там? А, это ты.',
          'Осторожно, фонарь горячий!',
          'Не отвлекай, я охраняю твой рабочий стол.'
        ]
      },
      en: {
        celebration: [
          'Pew-pew-pew! Task cleared!',
          'Pew-pew! Raid complete — loot secured!',
          'Pew-pew-pew-pew! Speranza would be proud!',
          'Done! Celebratory shots into the ceiling!'
        ],
        idle: [
          'I counted the bolts in my backpack… one is missing. Eh, later.',
          'The thermos is still warm. The raid goes on.',
          'If you see an ARC — you did NOT see an ARC. Deal?',
          'A 14mm wrench solves 90% of problems. The rest need a 17mm.',
          'Hear that hum from above?.. Oh, that is just your computer.',
          'Topside rule: it is not about the loot, it is about surviving. And loot.',
          'I patted my headlamp. It says you are doing great.'
        ],
        click: [
          'Huh? What? I am on watch!',
          'Knock knock! Oh, it is you.',
          'Careful, the lamp is hot!',
          'Do not distract me, I am guarding your desktop.'
        ]
      }
    };
    let quipTimer = 0;
    let quipHideTimer = 0;
    let statusSnapshotSeen = false;
    const lastRunStateById = new Map();

    function quipLang() {
      const tag = typeof currentLocaleTag === 'string' ? currentLocaleTag.toLowerCase() : '';
      return tag.indexOf('ru') === 0 ? 'ru' : 'en';
    }

    function randomQuip(kind) {
      const pack = BOLTIK_QUIPS[quipLang()] || BOLTIK_QUIPS.en;
      const list = pack[kind] || pack.idle;
      return list[Math.floor(Math.random() * list.length)];
    }

    function showQuip(text, durationMs) {
      const el = document.getElementById('boltik-quip');
      if (!el || !text) return;
      const bubbleTheme = manifest && manifest.theme && manifest.theme.bubble;
      if (bubbleTheme) {
        if (typeof bubbleTheme.background === 'string') el.style.background = bubbleTheme.background;
        if (typeof bubbleTheme.foreground === 'string') el.style.color = bubbleTheme.foreground;
        if (typeof bubbleTheme.border === 'string') el.style.borderColor = bubbleTheme.border;
      }
      el.textContent = text;
      el.hidden = false;
      requestAnimationFrame(() => el.classList.add('quip-visible'));
      clearTimeout(quipHideTimer);
      quipHideTimer = setTimeout(() => {
        el.classList.remove('quip-visible');
        setTimeout(() => {
          el.hidden = true;
        }, 220);
      }, Math.max(1500, durationMs || 4500));
    }

    function playCelebration() {
      if (!manifest || isThreeManifest(manifest)) return;
      if (!manifest.states.celebration) return;
      if (preferredStateName !== 'idle' || interactionStateActive) return;
      clearIdleVariantTimer();
      interactionStateActive = true;
      setState('celebration');
      showQuip(randomQuip('celebration'), 6000);
    }

    function noteConversationCompletions(nextActivities) {
      if (!statusSnapshotSeen) {
        statusSnapshotSeen = true;
        for (const activity of nextActivities) {
          lastRunStateById.set(activity.id, activity.runState);
        }
        return;
      }
      let anyCompleted = false;
      for (const activity of nextActivities) {
        const previousRunState = lastRunStateById.get(activity.id);
        lastRunStateById.set(activity.id, activity.runState);
        if (previousRunState === 'running' && activity.runState === 'idle') {
          anyCompleted = true;
        }
      }
      const liveIds = new Set(nextActivities.map((activity) => activity.id));
      for (const id of Array.from(lastRunStateById.keys())) {
        if (!liveIds.has(id)) lastRunStateById.delete(id);
      }
      if (anyCompleted) playCelebration();
    }

    function scheduleQuip() {
      clearTimeout(quipTimer);
      const delay = QUIP_MIN_DELAY_MS + Math.floor(Math.random() * (QUIP_MAX_DELAY_MS - QUIP_MIN_DELAY_MS + 1));
      quipTimer = setTimeout(() => {
        quipTimer = 0;
        if (
          manifest &&
          !isThreeManifest(manifest) &&
          !reducedMotion.matches &&
          preferredStateName === 'idle' &&
          stateName === 'idle' &&
          !interactionStateActive
        ) {
          showQuip(randomQuip('idle'), 5000);
        }
        scheduleQuip();
      }, delay);
    }
    // ===== Конец кастомизации «Болтика» =====

    function clearAnimationSchedule() {
      if (animationFrameRequest) {
        cancelAnimationFrame(animationFrameRequest);
        animationFrameRequest = 0;
      }
      if (animationWakeTimer) {
        clearTimeout(animationWakeTimer);
        animationWakeTimer = 0;
      }
    }

    function scheduleAnimationTick() {
      if (
        !manifest ||
        reducedMotion.matches ||
        animationFrameRequest ||
        animationWakeTimer
      ) {
        return;
      }
      if (!usesPointerIdleFrameInterval()) {
        animationFrameRequest = requestAnimationFrame(tick);
        return;
      }
      const remaining = Math.max(
        0,
        IDLE_FRAME_INTERVAL_MS - (performance.now() - lastFrameAt)
      );
      animationWakeTimer = setTimeout(() => {
        animationWakeTimer = 0;
        animationFrameRequest = requestAnimationFrame(tick);
      }, remaining);
    }

    function restartAnimationSchedule() {
      clearAnimationSchedule();
      scheduleAnimationTick();
    }

    function setIdleFrameRate(enabled) {
      if (idleFrameRate === enabled) return;
      idleFrameRate = enabled;
      lastFrameAt = performance.now();
      restartAnimationSchedule();
    }

    function handlePointerPresence(inside) {
      pointerInside = inside;
      clearPointerIdleTimer();
      if (inside) {
        setIdleFrameRate(false);
        return;
      }
      if (idleFrameRate) return;
      pointerIdleTimer = setTimeout(() => {
        pointerIdleTimer = 0;
        setIdleFrameRate(true);
      }, POINTER_IDLE_DELAY_MS);
    }

    function handleHostClick(data) {
      if (performance.now() < suppressBodyClickUntil) return;
      const values = [
        data.button,
        data.clientX,
        data.clientY,
        data.normalizedX,
        data.normalizedY
      ];
      if (!values.every((value) => typeof value === 'number' && Number.isFinite(value))) {
        return;
      }
      if (isThreeManifest(manifest)) {
        if (!threePetHandle || typeof threePetHandle.hitTest !== 'function') return;
        const hit = threePetHandle.hitTest(data.clientX, data.clientY);
        reportThreeHitRegion(hit);
        if (data.button !== 0 || !hit) return;
      }
      if (threePetHandle && typeof threePetHandle.noteInteraction === 'function') {
        threePetHandle.noteInteraction();
      }
      stage.dispatchEvent(new CustomEvent(CLICK_MESSAGE_TYPE, {
        bubbles: true,
        detail: {
          button: data.button,
          clientX: data.clientX,
          clientY: data.clientY,
          normalizedX: data.normalizedX,
          normalizedY: data.normalizedY
        }
      }));
    }

    function tick(now) {
      animationFrameRequest = 0;
      if (manifest) {
        const state = manifest.states[stateName] || manifest.states.idle;
        const interval = usesPointerIdleFrameInterval()
          ? IDLE_FRAME_INTERVAL_MS
          : 1000 / state.fps;
        if (!reducedMotion.matches && now - lastFrameAt >= interval) {
          if (!state.loop && frame >= state.frames - 1) {
            interactionStateActive = false;
            setState(preferredStateName);
            scheduleIdleVariant();
            scheduleAnimationTick();
            return;
          }
          const steps = Math.max(1, Math.floor((now - lastFrameAt) / interval));
          frame = state.loop ? (frame + steps) % state.frames : Math.min(state.frames - 1, frame + steps);
          lastFrameAt += steps * interval;
          render();
        }
      }
      scheduleAnimationTick();
    }

    const bubbleController = initPetBubbleController({
      stage,
      bubble: conversationBubble,
      header: conversationCenterHeader,
      clearAll: conversationCenterClearAll,
      list: conversationList,
      closeLayer: conversationCloseLayer,
      stackLayers: conversationStackLayers,
      toggle: conversationBubbleToggle,
      toggleIcon: conversationBubbleToggleIcon,
      toggleCount: conversationBubbleToggleCount,
      screenMarginPx: BUBBLE_SCREEN_MARGIN_PX,
      listMinHeightPx: BUBBLE_LIST_MIN_HEIGHT_PX,
      listMaxHeightPx: BUBBLE_LIST_MAX_HEIGHT_PX,
      getCopy: () => currentCopy(),
      getLocaleTag: () => resolveCopyLocale(currentLocaleTag, UI_COPY_LOCALES),
      formatCopy,
      isReducedMotion: () => reducedMotion.matches,
      isChineseLocale: () => isChineseLocale(currentLocaleTag),
      openConversation: (conversationId) => openConversation(conversationId),
      onDidRender: (info) => handleBubbleDidRender(info),
      onCloseRevealChange: () => resize(),
      onReplyKeyboardFocus: (active) => parent.postMessage({ type: 'daimon-pet:keyboard-focus', active }, '*'),
      getActiveElement: () => document.activeElement
    });

    // 开机动画:host 在 runtime-ready 后发来;pet.js 尚未 mount 时先挂起,
    // mount 完成后补播(后台预加载的 runtime 不自动播,等 host 消息)
    let pendingBoot = false;
    let shutdownGeneration = 0;
    function playPetBoot() {
      shutdownGeneration += 1;
      if (!threePetHandle || typeof threePetHandle.playBoot !== 'function') {
        pendingBoot = true;
        return;
      }
      try {
        threePetHandle.playBoot();
      } catch {
        // A Three bundle error must not break the Pet runtime.
      }
    }

    // 关机动画:播完(或旧 runtime 不支持时立即)回 shutdown-done,host 据此销毁窗口
    function playPetShutdown() {
      const generation = ++shutdownGeneration;
      const done = () => {
        if (generation !== shutdownGeneration) return;
        parent.postMessage({ type: SHUTDOWN_DONE_MESSAGE_TYPE }, '*');
      };
      if (!threePetHandle || typeof threePetHandle.playShutdown !== 'function') {
        done();
        return;
      }
      try {
        threePetHandle.playShutdown().then(done, done);
      } catch {
        done();
      }
    }

    let dragScreenStart = null;
    let dragHasMoved = false;
    let suppressBodyClickUntil = 0;
    addEventListener('message', (event) => {
      const data = event.data;
      if (!data) return;
      if (data.type === MESSAGE_TYPE) {
        handleHostState(data.state);
      } else if (data.type === 'daimon-pet:pointer') {
        if (isThreeManifest(manifest) && threePetHandle) {
          if (data.phase === 'down' && !threePetHandle.hitTest(data.clientX, data.clientY)) {
            reportThreeHitRegion(false);
            return;
          }
          const dragging = data.phase === 'down' ? true
            : data.phase === 'up' || data.phase === 'cancel' ? false
            : typeof data.dragging === 'boolean' ? data.dragging : threeDragging;
          if (dragging && !threeDragging) {
            dragScreenStart = Number.isFinite(data.screenX) && Number.isFinite(data.screenY)
              ? { x: data.screenX, y: data.screenY } : null;
            dragHasMoved = false;
          }
          if (dragScreenStart && Number.isFinite(data.screenX) && Number.isFinite(data.screenY) &&
              Math.hypot(data.screenX - dragScreenStart.x, data.screenY - dragScreenStart.y) >= 6) {
            dragHasMoved = true;
          }
          if (typeof threePetHandle.setDragging === 'function') {
            if (!dragging && threeDragging && dragHasMoved) suppressBodyClickUntil = performance.now() + 100;
            threePetHandle.setDragging(dragging, dragHasMoved && data.phase !== 'cancel');
          }
          if (!dragging) dragScreenStart = null;
          if (dragging !== threeDragging) {
            threeDragging = dragging;
            // 拖动全程保持交互区,松手后按落点重新判定
            if (dragging) reportThreeHitRegion(true);
          }
          const px = data.clientX;
          const py = data.clientY;
          if (Number.isFinite(px) && Number.isFinite(py)) {
            handleThreePointerMove({ clientX: px, clientY: py, screenX: data.screenX });
            if (!threeDragging && typeof threePetHandle.hitTest === 'function') {
              reportThreeHitRegion(threePetHandle.hitTest(px, py));
            }
          }
        }
      } else if (data.type === POINTER_PRESENCE_MESSAGE_TYPE) {
        handlePointerPresence(data.inside === true);
      } else if (data.type === DISPLAY_SCALE_MESSAGE_TYPE) {
        const scale = Number(data.scale);
        displayScale = Number.isFinite(scale)
          ? Math.max(DISPLAY_SCALE_MIN, Math.min(DISPLAY_SCALE_MAX, scale))
          : 1;
        resize();
        if (threePetHandle && typeof threePetHandle.refreshDockLayout === 'function') {
          threePetHandle.refreshDockLayout();
        }
      } else if (data.type === ANCHOR_MESSAGE_TYPE) {
        const displaySize = Number(data.displaySize);
        const sizeChanged = Number.isFinite(displaySize) && displaySize >= 1 && displaySize <= 4096 && displaySize !== hostDisplaySize;
        if (sizeChanged) hostDisplaySize = displaySize;
        const scale = Number(data.contentScale);
        const scaleChanged = Number.isFinite(scale) && scale !== displayScale;
        if (scaleChanged) displayScale = Math.max(DISPLAY_SCALE_MIN, Math.min(DISPLAY_SCALE_MAX, scale));
        const xRatio = Number(data.xRatio);
        const bottomRatio = Number(data.bottomRatio);
        petAnchorXRatio = Number.isFinite(xRatio)
          ? Math.min(1, Math.max(0, xRatio))
          : 0.5;
        // bottomRatio 允许大于 1:球盒透明边可伸出窗口底(见 currentPetAnchor),
        // 精确上限在那里按盒尺寸钳制
        petAnchorBottomRatio = Number.isFinite(bottomRatio)
          ? Math.min(2, Math.max(0, bottomRatio))
          : 1;
        resize();
        if ((scaleChanged || sizeChanged) && threePetHandle && typeof threePetHandle.refreshDockLayout === 'function') {
          threePetHandle.refreshDockLayout();
        }
      } else if (data.type === CLICK_MESSAGE_TYPE) {
        handleHostClick(data);
      } else if (data.type === BOOT_MESSAGE_TYPE) {
        playPetBoot();
      } else if (data.type === SHUTDOWN_MESSAGE_TYPE) {
        playPetShutdown();
      }
    });
    parent.postMessage({ type: RUNTIME_READY_MESSAGE_TYPE }, '*');
    stage.addEventListener(CLICK_MESSAGE_TYPE, (event) => {
      const detail = event && event.detail;
      if (detail && detail.button === 0) {
        showQuip(randomQuip('click'), 3500);
      }
    });
    scheduleQuip();
    const widgetApi = window.DaimonWidget;
    const conversationsApi = widgetApi && widgetApi.conversations;
    conversationBubble.setAttribute('role', 'region');
    applyHostLocale(
      widgetApi && typeof widgetApi.locale === 'string'
        ? widgetApi.locale
        : document.documentElement.lang || navigator.language
    );
    const stopLocaleChange =
      widgetApi && typeof widgetApi.onLocaleChange === 'function'
        ? widgetApi.onLocaleChange((nextLocale) => {
            applyHostLocale(
              typeof nextLocale === 'string' ? nextLocale : widgetApi.locale
            );
          })
        : null;
    let stopConversationStatusChange = null;
    if (
      conversationsApi &&
      typeof conversationsApi.onStatusChange === 'function'
    ) {
      stopConversationStatusChange = conversationsApi.onStatusChange(
        handleConversationStatus
      );
    }
    function cleanupThreePet() {
      const handle = threePetHandle;
      threePetHandle = null;
      if (!handle || typeof handle.dispose !== 'function') return;
      try {
        handle.dispose();
      } catch {
        // Page teardown must remain best-effort.
      }
    }
    addEventListener('pagehide', (event) => {
      if (event.persisted) return;
      cleanupThreePet();
      if (typeof stopLocaleChange === 'function') stopLocaleChange();
      if (typeof stopConversationStatusChange === 'function') {
        stopConversationStatusChange();
      }
    });
    addEventListener('resize', resize);
    reducedMotion.addEventListener?.('change', () => {
      clearIdleVariantTimer();
      render();
      restartAnimationSchedule();
      scheduleIdleVariant();
    });
    // 预览模式不注册任何 DOM 指针交互:眼睛钉住左上,命中/穿透/拖拽全部关闭
    if (!PET_PREVIEW) {
    document.addEventListener('mouseover', handleThreePointerMove);
    document.addEventListener('mousemove', handleThreePointerMove);
    document.addEventListener('click', (event) => {
      if (event.button !== 0 || performance.now() < suppressBodyClickUntil) return;
      if (threePetHandle && typeof threePetHandle.noteInteraction === 'function' &&
          threePetHandle.hitTest(event.clientX, event.clientY)) {
        threePetHandle.noteInteraction();
      }
    });

    // 事件驱动的命中上报(参考 kimi-pet 的本地闭环):穿透态下 macOS forward 的
    // mousemove 也会到达 iframe,命中判定不等 host 的 100ms 轮询,把"悬停→可按下"
    // 的延迟压到最低;轮询路径('daimon-pet:pointer')保留为兜底。
    // Deduplicate unchanged hit states while releasing misses immediately.
    let threeDomHitLastAt = 0;
    function handleThreeDomPointer(event) {
      if (!isThreeManifest(manifest) || threeDragging) return;
      if (!threePetHandle || typeof threePetHandle.hitTest !== 'function') return;
      const now = performance.now();
      if (event.type !== 'pointerdown' && now - threeDomHitLastAt < 16) return;
      threeDomHitLastAt = now;
      reportThreeHitRegion(threePetHandle.hitTest(Number(event.clientX), Number(event.clientY)));
    }
    document.addEventListener('mousemove', handleThreeDomPointer, true);
    document.addEventListener('pointerdown', handleThreeDomPointer, true);
    }

    function loadThreePet(value) {
      return fetch('/workspace/' + encodeURIComponent(value.three.file), { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error('threeLoadFailed');
          return response.text();
        })
        .then((code) => {
          if (typeof code !== 'string' || !code.trim()) {
            throw new Error('threeLoadFailed');
          }
          new Function(code)();
          const threeApi = window.DaimonPetThree;
          if (!threeApi || typeof threeApi.mount !== 'function') {
            throw new Error('threeLoadFailed');
          }
          threePet.setAttribute('aria-label', value.name || currentCopy().petAria);
          threePet.style.display = 'block';
          threePetHandle = threeApi.mount(threePet, PET_PREVIEW ? { preview: true } : { onBodyBoundsChange: acceptThreeBodyBounds });
          if (!threePetHandle) throw new Error('threeLoadFailed');
          resize();
          if (pendingBoot) {
            pendingBoot = false;
            playPetBoot();
          }
        });
    }

    fetch('/workspace/pet.json', { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error('manifestLoadFailed');
        return response.json();
      })
      .then((value) => {
        if (!value || typeof value !== 'object') {
          throw new Error('manifestInvalid');
        }
        manifest = value;
        applyBubbleTheme(value.theme && value.theme.bubble);
        if (isThreeManifest(value)) {
          if (!value.three || value.three.file !== 'pet.js') {
            throw new Error('threeManifestInvalid');
          }
          loadThreePet(value).catch((reason) =>
            showError(reason instanceof Error ? reason.message : String(reason))
          );
          return;
        }
        if (!value.atlas || !value.states || !value.states.idle) {
          throw new Error('spritesheetManifestInvalid');
        }
        pet.setAttribute('aria-label', value.name || currentCopy().petAria);
        pet.style.width = String(value.atlas.frameWidth) + 'px';
        pet.style.height = String(value.atlas.frameHeight) + 'px';
        pet.style.backgroundImage = 'url("/workspace/' + encodeURIComponent(value.spritesheet) + '")';
        pet.style.backgroundSize =
          String(value.atlas.frameWidth * value.atlas.columns) + 'px ' +
          String(value.atlas.frameHeight * value.atlas.rows) + 'px';
        pet.style.display = 'block';
        resize();
        measureSpritesheetWhenReady();
        setState(preferredStateName);
        render();
        restartAnimationSchedule();
        scheduleIdleVariant();
      })
      .catch((reason) => showError(reason instanceof Error ? reason.message : String(reason)));
  })();
  </script>
</body>
</html>
